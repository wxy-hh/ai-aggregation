# ============================================
# AI-Aggregation 生产环境 docker-compose
# 使用方式：docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ============================================
services:
  # ---------- Nginx 反向代理 ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - web_public:/app/apps/web/public:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - ai-net

  # ---------- Web（Next.js）----------
  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    container_name: ai-web
    env_file: .env.prod
    volumes:
      - web_public:/app/apps/web/public
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------- Worker（BullMQ）----------
  worker:
    build:
      context: ../../
      dockerfile: apps/worker/Dockerfile
    container_name: ai-worker
    env_file: .env.prod
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - ai-net

volumes:
  web_public:

networks:
  ai-net:
    driver: bridge
