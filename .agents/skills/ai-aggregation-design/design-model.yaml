name: "AI Aggregation"
philosophy: "极致未来感的冷白玻璃工作台，具备轻盈通透与克制秩序。界面通过磨砂玻璃面板与半透明材质打破沉重感，结合平滑渐变、柔和背光和微发光效果，营造数字宇宙的艺术质感。所有的视觉光效与折射均服务于功能，建立直观的 Z 轴空间深度。"
primary_mode: "light"
brand_domain: "AI aggregation / multi-model creative workspace"
brand_type: "ui-rich"
mono_for_code: false
mono_for_metrics: false

primitives:
  colors:
    neutral:
      50: "#FFFFFF"
      100: "#F8FAFC"
      200: "#F3F5FA" # 浅色模式底板底色
      300: "#E2E8F0" # 常规边框
      400: "#CBD5E1"
      500: "#94A3B8"
      600: "#64748B"
      700: "#475569"
      800: "#334155"
      900: "#0F172A" # 深色模式主容器
      950: "#020617" # 深色模式底板底色
    brand:
      blue_500: "#3B82F6" # 科技蓝主色/发光核
      blue_600: "#2563EB"
      violet_500: "#8B5CF6" # 梦幻紫辅助色
      violet_600: "#7C3AED"
      rose_500: "#EC4899" # 玫瑰粉图形色
      indigo_500: "#6366F1" # 渐变过渡色
    red:
      50: "#FFF1F2"
      500: "#E54350"
      900: "#7F1D1D"
    green:
      50: "#F0FDF4"
      500: "#10B981" # 极光绿
      900: "#14532D"
    amber:
      50: "#FFFBEB"
      500: "#F59E0B" # 警示黄
      900: "#78350F"
  spacing: [0, 2, 4, 8, 12, 16, 24, 32, 40, 48, 64, 96]
  radii: [0, 8, 12, 16, 24, 32, 48, 999]

tokens:
  colors:
    light:
      background: "{neutral.200}"
      surface1: "{neutral.50}"
      surface2: "{neutral.100}"
      surface3: "{neutral.200}"
      border: "{neutral.300}"
      border_visible: "#D5DAEB"
      text1: "#0F172A"
      text2: "{neutral.700}"
      text3: "{neutral.600}"
      text4: "{neutral.500}"
      accent: "{brand.blue_500}"
      accent_subtle: "#F3F6FF"
    dark:
      background: "{neutral.950}"
      surface1: "{neutral.900}"
      surface2: "#182230"
      surface3: "{neutral.800}"
      border: "{neutral.800}"
      border_visible: "{neutral.700}"
      text1: "#F8FAFC"
      text2: "#CBD5E1"
      text3: "{neutral.500}"
      text4: "{neutral.600}"
      accent: "#60A5FA"
      accent_subtle: "#1E2A55"
    success: "{green.500}"
    warning: "{amber.500}"
    error: "{red.500}"
  spacing:
    2xs: 2
    xs: 4
    sm: 8
    md: 16
    lg: 24
    xl: 32
    2xl: 48
    3xl: 64
    4xl: 96
  radii:
    element: 8
    control: 12
    component: 24
    container: 32
    pill: 999
  typography:
    display:
      family: "Space Grotesk"
      size: "60px"
      weight: 700
      line_height: 1.08
      letter_spacing: "-0.025em"
    h1:
      family: "Space Grotesk"
      size_mobile: "36px"
      size_desktop: "60px"
      size_wide: "72px"
      weight: 900
      line_height: 1.10
      letter_spacing: "-0.05em"
      text_shadow: "0 4px 12px rgba(59, 130, 246, 0.25), 0 1px 2px rgba(0, 0, 0, 0.1)"
    h2:
      family: "system-ui"
      size: "30px"
      weight: 700
      line_height: 1.25
      letter_spacing: "-0.03em"
    h3:
      family: "system-ui"
      size: "24px"
      weight: 700
      line_height: 1.35
      letter_spacing: "-0.02em"
    body:
      family: "system-ui"
      size: "14px"
      weight: 400
      line_height: 1.6
      letter_spacing: "0"
      sharpness_filter: "0 1px 2px rgba(0, 0, 0, 0.15)" # 用于提升毛玻璃上白字对比度
    body_sm:
      family: "system-ui"
      size: "12px"
      weight: 400
      line_height: 1.5
      letter_spacing: "0"
    caption:
      family: "system-ui"
      size: "12px"
      weight: 500
      line_height: 1.4
      letter_spacing: "0"
    label:
      family: "system-ui"
      size: "10px"
      weight: 700
      line_height: 1.0
      letter_spacing: "0.05em"
    mono:
      family: "JetBrains Mono"
      size: "13px"
      weight: 500
      line_height: 1.4
      letter_spacing: "0"
  elevation:
    strategy: "3-tier-glow" # 主阴影 + 环境漫反射 + 内发光
    z0: "none"
    z1: "0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 1px 0 rgba(0, 0, 0, 0.02)" # 平贴微悬
    z2: "0 4px 12px -2px rgba(15, 23, 42, 0.04), 0 2px 6px -1px rgba(15, 23, 42, 0.03)" # 正常悬起卡片
    z3: "0 12px 20px -8px rgba(15, 23, 42, 0.08), 0 4px 10px -2px rgba(15, 23, 42, 0.04)" # 中度浮空导航栏
    z4: "0 20px 40px -15px rgba(59, 130, 246, 0.12), 0 8px 20px -10px rgba(0, 0, 0, 0.05)" # 深度悬浮Hero区
    z5: "0 30px 60px -20px rgba(15, 23, 42, 0.25), 0 10px 30px -15px rgba(59, 130, 246, 0.15), inset 0 1px 0 0 rgba(255, 255, 255, 0.1)" # 顶级悬浮模态框
  motion:
    personality: "smooth"
    easing: "cubic-bezier(0.2, 0.8, 0.2, 1)"
    duration_fast: "200ms"
    duration_normal: "300ms"
  hero_stage:
    preset: "dynamic-mesh"
    observed_style:
      description: "首页英雄区是一块被柔光包围的大工作台。背景层负责制造氛围和聚焦，包含蓝、紫、粉的极淡扫掠光晕，不抢文字和主操作。"
      where_used: ["home hero", "workspace background"]
    background:
      medium: "mesh-gradient"
      color_palette: ["rgba(59, 130, 246, 0.1)", "rgba(139, 92, 246, 0.1)", "rgba(236, 72, 153, 0.1)"]
      blur: "blur-3xl"
      animation: "pulse-slow"
  iconography:
    observed_style:
      description: "纯几何线性轮廓，约 2px 笔画，圆角端点，装饰极少，干净、克制。"
    fallback_kit:
      name: "Lucide"
      weight: "2px"
      cdn: "https://unpkg.com/lucide-static/font/lucide.css"

components:
  button_primary:
    source: "observed"
    background: "linear-gradient(90deg, #2563EB 0%, #4F46E5 100%)" # blue-600 到 indigo-600
    color: "#FFFFFF"
    height_md: "44px"
    radius: "{radii.control}"
    high_light_top: "1px solid rgba(255, 255, 255, 0.2)" # 顶部 1px 发光切线
    shadow: "shadow-md-glass"
    hover: "scale-105, shadow-lg shadow-blue-500/20, duration-200"
    active: "scale-98, 阴影收敛"
  button_secondary:
    source: "observed"
    background_light: "rgba(255, 255, 255, 0.4)"
    background_dark: "rgba(15, 23, 42, 0.4)"
    backdrop_blur: "20px" # G-2级标准模糊
    border: "1px solid rgba(255, 255, 255, 0.5)"
    border_dark: "1px solid rgba(255, 255, 255, 0.08)"
    radius: "{radii.control}"
    high_light_top: "1px solid rgba(255, 255, 255, 0.1)"
  card_standard:
    source: "observed"
    background_light: "rgba(255, 255, 255, 0.5)"
    background_dark: "rgba(15, 23, 42, 0.5)"
    backdrop_blur: "40px" # G-3级深度模糊
    border: "1px solid rgba(255, 255, 255, 0.6)"
    border_dark: "1px solid rgba(255, 255, 255, 0.1)"
    radius: "{radii.component}"
    shadow: "shadow-xl"
  input_text:
    source: "observed"
    height_md: "44px"
    background_light: "rgba(255, 255, 255, 0.8)"
    background_dark: "rgba(15, 23, 42, 0.8)"
    backdrop_blur: "20px"
    border_light: "1px solid rgba(226, 232, 240, 0.5)"
    border_dark: "1px solid rgba(30, 41, 59, 0.5)"
    radius: "{radii.control}"
    inner_shadow: "向内凹陷微阴影"
    focus: "border-blue-500/50, ring-2 ring-blue-500/10, bg-white/95"
  header_navbar:
    source: "observed"
    height_desktop: "72px"
    scroll_threshold: "10px"
    idle_state: "bg-transparent, border-transparent"
    active_state: "bg-white/70(dark:bg-slate-950/75), backdrop-blur-2xl, shadow-md-glass, border-b border-white/40"
  modal_shell:
    source: "observed"
    backdrop_blur: "8px"
    backdrop_bg: "rgba(2, 6, 23, 0.5)" # bg-slate-950/50
    background_light: "rgba(255, 255, 255, 0.8)"
    background_dark: "rgba(15, 23, 42, 0.85)"
    backdrop_blur_container: "40px"
    radius: "{radii.component}"
    border_light: "1px solid rgba(255, 255, 255, 0.6)"
    border_dark: "1px solid rgba(255, 255, 255, 0.1)"
    shadow: "shadow-2xl-glass (Z-5)"
    glow_inner: "inset 0 0 40px rgba(59, 130, 246, 0.05)"

app_screen:
  archetype: "dashboard"
  frame: "browser"
  frame_params:
    url: "app.ai-aggregation.local/home"
    title: "AI Studio - 多模型工作台"
  content_seed: "一个 AI 聚合工作台：结合磨砂玻璃面板和 Z-0 到 Z-5 的分层空间，展现出多模型对话、图像生成、语音转写等多任务在视觉阻尼感下的精致协作。"
  required_tokens_checklist:
    - "text1, text2, text3, text4"
    - "surface1, surface2, surface3, border"
    - "accent, accent_subtle, success, error"
    - "h1, h2, h3, body, body_sm, label"
    - "component, control, pill"
