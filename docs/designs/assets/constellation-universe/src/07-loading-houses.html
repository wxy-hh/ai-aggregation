<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星座寰宇 · 星盘绘制中（含宫位）</title>
<style>
/* ══════════════════════════════════════════════════════════════
   星座寰宇 · 双主题设计基准 —— 模块入口页
   壳层逐像素复刻 AI STUDIO 系统导航 + 命理大师模块侧栏
   ══════════════════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  /* ── 浅色主题：适配系统主体（雾白 / 浅蓝 / 蓝—靛渐变） ── */
  --page-bg: #F5F7FA;
  --glow-a: rgba(219, 234, 254, 0.62);
  --glow-b: rgba(233, 213, 255, 0.34);
  --glow-c: rgba(191, 219, 254, 0.34);
  --ink-1: #0F172A; --ink-2: #475569; --ink-3: #64748B; --ink-4: #94A3B8;
  --brand: #4969E9; --brand-2: #7B8FFF; --indigo: #6366F1; --violet: #8B5CF6;
  --cyan: #06B6D4; --gold: #C99645;
  --sysnav-bg: rgba(255, 255, 255, 0.72);
  --sysnav-border: rgba(255, 255, 255, 0.70);
  --panel-bg: rgba(255, 255, 255, 0.55);
  --panel-border: rgba(255, 255, 255, 0.66);
  --panel-shadow: 0 20px 44px -18px rgba(59, 130, 246, 0.12), 0 6px 16px -8px rgba(15, 23, 42, 0.05);
  --hero-bg: linear-gradient(158deg, rgba(255,255,255,0.78) 0%, rgba(255,255,255,0.42) 46%, rgba(240,245,255,0.34) 100%);
  --hero-border: rgba(255, 255, 255, 0.68);
  --hero-shadow: 0 24px 52px -18px rgba(59, 130, 246, 0.15), 0 8px 22px -10px rgba(15, 23, 42, 0.06);
  --card-bg: #FFFFFF; --card-border: rgba(226, 232, 240, 0.95);
  --card-shadow: 0 12px 28px -14px rgba(59, 130, 246, 0.10), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
  --chip-bg: rgba(255, 255, 255, 0.78); --chip-border: rgba(199, 210, 254, 0.9); --chip-ink: #4E67E6;
  --ring: #CBD5F4; --tick: #C2CDEE; --spoke: #E4EAF9; --dash: #D9E1F7; --star4: #BDC9F0;
  --aspect-v: rgba(139, 92, 246, 0.40); --aspect-c: rgba(6, 182, 212, 0.36);
  --planet: #818CF8; --sun: #E7A93E; --moon: #7E96C8;
  --halo: radial-gradient(circle, rgba(99,102,241,0.16) 0%, rgba(99,102,241,0.05) 55%, transparent 72%);
  --dust: rgba(99, 102, 241, 0.30);
  --divider: rgba(148, 163, 184, 0.30);
  --starfield-opacity: 0;
}
html[data-theme="dark"] {
  /* ── 暗夜星空：午夜蓝 × 紫罗兰深空星云 + 星光金点缀 ── */
  --page-bg: #060A1B;
  --glow-a: rgba(63, 82, 220, 0.24);
  --glow-b: rgba(124, 88, 236, 0.20);
  --glow-c: rgba(30, 48, 140, 0.30);
  --ink-1: #EDEFFA; --ink-2: #C4C9E5; --ink-3: #9AA1C9; --ink-4: #6D74A0;
  --brand: #6D8BFF; --brand-2: #8B5CF6; --indigo: #818CF8; --violet: #A78BFA;
  --cyan: #67E8F9; --gold: #EAC98A;
  --sysnav-bg: rgba(12, 17, 42, 0.66);
  --sysnav-border: rgba(255, 255, 255, 0.07);
  --panel-bg: rgba(15, 21, 52, 0.58);
  --panel-border: rgba(255, 255, 255, 0.09);
  --panel-shadow: 0 26px 60px -22px rgba(1, 4, 18, 0.85), 0 0 90px -40px rgba(99, 102, 241, 0.30);
  --hero-bg: linear-gradient(156deg, rgba(38, 47, 104, 0.52) 0%, rgba(17, 23, 58, 0.46) 48%, rgba(27, 20, 68, 0.42) 100%);
  --hero-border: rgba(255, 255, 255, 0.10);
  --hero-shadow: 0 32px 84px -26px rgba(1, 4, 18, 0.88), 0 0 130px -34px rgba(109, 99, 246, 0.32);
  --card-bg: rgba(21, 28, 68, 0.66); --card-border: rgba(255, 255, 255, 0.09);
  --card-shadow: 0 18px 44px -20px rgba(1, 4, 18, 0.80), 0 0 70px -36px rgba(99, 102, 241, 0.28);
  --chip-bg: rgba(255, 255, 255, 0.06); --chip-border: rgba(255, 255, 255, 0.13); --chip-ink: #C9CFF1;
  --ring: rgba(156, 168, 255, 0.40); --tick: rgba(156, 168, 255, 0.24); --spoke: rgba(156, 168, 255, 0.13);
  --dash: rgba(156, 168, 255, 0.19); --star4: rgba(196, 205, 255, 0.38);
  --aspect-v: rgba(167, 139, 250, 0.48); --aspect-c: rgba(103, 232, 249, 0.40);
  --planet: #A5B4FC; --sun: #EAC98A; --moon: #DCE6FF;
  --halo: radial-gradient(circle, rgba(129,140,248,0.22) 0%, rgba(139,92,246,0.09) 52%, transparent 74%);
  --dust: rgba(203, 213, 255, 0.55);
  --divider: rgba(148, 163, 255, 0.16);
  --starfield-opacity: 1;
}
html, body { height: 100%; }
body {
  font-family: "DM Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--page-bg);
  color: var(--ink-1);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.stage { width: 1600px; height: 1000px; position: relative; overflow: hidden; }
/* ── 环境光 ── */
.ambient { position: absolute; inset: 0; pointer-events: none; }
.ambient i { position: absolute; border-radius: 50%; filter: blur(70px); }
.ambient .a1 { width: 900px; height: 640px; right: -180px; top: -220px; background: var(--glow-a); }
.ambient .a2 { width: 760px; height: 620px; left: -240px; bottom: -260px; background: var(--glow-b); }
.ambient .a3 { width: 620px; height: 520px; right: 260px; bottom: -240px; background: var(--glow-c); }
html[data-theme="dark"] .ambient .a1 { filter: blur(110px); }
html[data-theme="dark"] .ambient .a2 { filter: blur(120px); }
html[data-theme="dark"] .ambient .a3 { filter: blur(120px); }
.starfield { position: absolute; inset: 0; pointer-events: none; opacity: var(--starfield-opacity); transition: opacity .4s; }
.starfield b { position: absolute; border-radius: 50%; background: #DDE4FF; }
.starfield .spark { position: absolute; color: rgba(226, 232, 255, 0.85); }
/* ══ 布局骨架 ══ */
.app { position: relative; display: grid; grid-template-columns: 100px 1fr; height: 1000px; }
.main { display: grid; grid-template-columns: 304px 1fr; height: 1000px; }
/* ══ 左侧 AI STUDIO 系统导航（既有，逐像素复刻） ══ */
.sysnav {
  position: relative; z-index: 5;
  background: var(--sysnav-bg);
  border-right: 1px solid var(--sysnav-border);
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  display: flex; flex-direction: column; align-items: center;
  padding: 18px 0 16px;
}
.sysnav .logo { display: flex; flex-direction: column; align-items: center; gap: 7px; margin-bottom: 26px; }
.sysnav .logo .mark { width: 46px; height: 46px; }
.sysnav .logo span { font-size: 10px; letter-spacing: 0.24em; font-weight: 700; color: var(--ink-4); }
.nav-items { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; width: 100%; }
.nav-it { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; padding: 8px 0 7px; color: var(--ink-3); }
.nav-it svg { width: 23px; height: 23px; stroke-width: 1.75; }
.nav-it em { font-style: normal; font-size: 12px; line-height: 1; }
.nav-it .ic { width: 44px; height: 44px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
.nav-it.active { color: var(--brand); }
html[data-theme="dark"] .nav-it.active { color: #9DB4FF; }
.nav-it.active .ic {
  background: linear-gradient(135deg, #4969E9 0%, #7B8FFF 100%);
  color: #fff; box-shadow: 0 10px 20px -6px rgba(73, 105, 233, 0.45);
}
.nav-it.active::before {
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 4px; height: 58px; border-radius: 0 4px 4px 0; background: #6B83FA;
}
.nav-it.action { margin-top: 6px; color: var(--ink-3); }
.nav-bottom { display: flex; flex-direction: column; align-items: center; gap: 20px; color: var(--ink-4); }
.nav-bottom svg { width: 21px; height: 21px; stroke-width: 1.7; }
.nav-bottom .me { position: relative; }
.nav-bottom .me i { position: absolute; top: 0; right: 1px; width: 7px; height: 7px; border-radius: 50%; background: #F26D8D; border: 1.5px solid #fff; }
html[data-theme="dark"] .nav-bottom .me i { border-color: #0B1130; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #1B1B1F; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
html[data-theme="dark"] .avatar { background: linear-gradient(135deg, #2A3568, #4C3A86); border: 1px solid rgba(255,255,255,.14); }
/* ══ 命理大师模块侧栏（既有 + 第四项） ══ */
.modnav-wrap { padding: 20px 0 20px 24px; height: 1000px; }
.modnav {
  position: relative; height: 100%; border-radius: 28px;
  background: var(--panel-bg); border: 1px solid var(--panel-border);
  box-shadow: var(--panel-shadow);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  padding: 22px 16px; display: flex; flex-direction: column; gap: 24px;
}
.modnav .head { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.modnav .head .bib {
  width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.70); border: 1px solid rgba(255,255,255,0.55); box-shadow: 0 2px 6px rgba(15,23,42,0.05);
  color: #4969E9;
}
html[data-theme="dark"] .modnav .head .bib { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.10); color: #9DB4FF; box-shadow: none; }
.modnav .head h3 { font-size: 14px; font-weight: 800; }
.modnav .head p { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.modnav .collapse {
  position: absolute; right: -11px; top: 54px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: 0 2px 6px rgba(15,23,42,.08);
  color: var(--ink-4); font-size: 13px; display: flex; align-items: center; justify-content: center; line-height: 1;
}
.modnav .group-label { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: var(--ink-4); padding: 0 6px; margin-bottom: 12px; }
.mod-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  border-radius: 16px; padding: 10px 12px; border: 1px solid transparent;
  text-align: left; background: transparent; margin-bottom: 8px;
}
.mod-item .ib {
  width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.52);
  color: #5B6B8C;
}
html[data-theme="dark"] .mod-item .ib { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.09); color: #B9C0E2; }
.mod-item .ib svg { width: 20px; height: 20px; }
.mod-item b { display: block; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.mod-item small { display: block; font-size: 12px; color: var(--ink-4); margin-top: 2px; }
.mod-item.active {
  background: linear-gradient(92deg, rgba(79, 109, 245, 0.13) 0%, rgba(139, 92, 246, 0.11) 100%);
  border-color: rgba(109, 111, 246, 0.30);
  box-shadow: 0 6px 16px -8px rgba(99, 102, 241, 0.35);
}
.mod-item.active b { color: var(--ink-1); }
.mod-item.active .ib {
  background: linear-gradient(135deg, #4F6DF5 0%, #8B5CF6 100%);
  border-color: transparent; color: #fff;
  box-shadow: 0 8px 18px -4px rgba(109, 99, 246, 0.50);
}
html[data-theme="dark"] .mod-item.active {
  background: linear-gradient(92deg, rgba(99, 130, 255, 0.18) 0%, rgba(139, 92, 246, 0.16) 100%);
  border-color: rgba(148, 140, 250, 0.36);
  box-shadow: 0 0 26px -6px rgba(124, 108, 246, 0.40);
}
</style>
<style>
/* ══ 右侧内容区 ══ */
.content { position: relative; padding: 20px 24px 20px 24px; height: 1000px; display: flex; flex-direction: column; gap: 18px; }
/* 页头：与命理各模块同规格 */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 4px 6px 0; }
.page-head .ttl { display: flex; align-items: center; gap: 12px; }
.page-head h1 { font-size: 29px; font-weight: 800; letter-spacing: -0.01em; }
.phase-badge {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 13px;
  font-size: 12px; font-weight: 700;
  background: rgba(99, 102, 241, 0.10); color: #5457E8; border: 1px solid rgba(99,102,241,0.14);
}
html[data-theme="dark"] .phase-badge { background: rgba(129, 140, 248, 0.14); color: #B9C2FF; border-color: rgba(129,140,248,0.20); }
.phase-badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.page-head .sub { margin-top: 7px; font-size: 14px; color: var(--ink-3); }
/* 模型切换（既有组件） */
.model-switch {
  display: flex; align-items: center; gap: 2px; padding: 3px;
  border-radius: 999px; background: var(--panel-bg); border: 1px solid var(--panel-border);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 4px 12px -6px rgba(15,23,42,0.08);
}
.model-switch span { padding: 7px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-3); }
.model-switch span.on {
  color: #fff; background: linear-gradient(135deg, #3D63F0, #5E7BFF);
  box-shadow: 0 6px 14px -4px rgba(61, 99, 240, 0.45);
}
/* ══════════════════════════════════════════════════════════════
   加载态 · 含宫位（V3.1 §9.7：晨光/静夜观测台，真实进度三段系统 + 末段 AI）
   ══════════════════════════════════════════════════════════════ */
:root {
  --err: #D96A7E; --err-ring: rgba(217, 106, 126, 0.16);
  --wm-opacity: 0.5;
}
html[data-theme="dark"] {
  --err: #E58A9B; --err-ring: rgba(229, 138, 155, 0.22);
  --wm-opacity: 0.55;
}
/* ══ 加载舞台：极淡星轨水印 + 观测台面板 + 流式解读占位 ══ */
.load-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 18px; }
.orbit-wm {
  position: absolute; left: 50%; top: 50%; width: 860px; height: 860px;
  transform: translate(-50%, -50%); opacity: var(--wm-opacity); pointer-events: none;
  -webkit-mask-image: radial-gradient(circle, #000 26%, transparent 70%);
  mask-image: radial-gradient(circle, #000 26%, transparent 70%);
}
.orbit-wm circle { fill: none; }
.orbit-wm .w1 { stroke: var(--ring); }
.orbit-wm .w2 { stroke: var(--tick); }
.orbit-wm .w3 { stroke: var(--dash); }
/* 观测台面板（复用基准稿玻璃容器语言：浅色=晨光观测台，深色=静夜观测台） */
.load-panel {
  position: relative; flex: 1; min-height: 0; border-radius: 32px; overflow: hidden;
  background: var(--hero-bg); border: 1px solid var(--hero-border); box-shadow: var(--hero-shadow);
  backdrop-filter: blur(26px) saturate(1.15); -webkit-backdrop-filter: blur(26px) saturate(1.15);
  display: grid; grid-template-columns: minmax(0, 1fr) 412px;
}
.load-panel::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent);
}
html[data-theme="dark"] .load-panel::before { background: linear-gradient(90deg, transparent, rgba(210,220,255,0.35), transparent); }
.load-left { position: relative; z-index: 2; padding: 34px 16px 30px 42px; display: flex; flex-direction: column; justify-content: center; }
/* 1. 四段真实进度清单（仅 已完成 / 进行中 / 未开始 三态，无百分比无倒计时） */
.plist { display: flex; flex-direction: column; gap: 6px; }
.pstep { display: flex; align-items: center; gap: 13px; padding: 11px 14px; border-radius: 14px; font-size: 14px; color: var(--ink-2); }
.pstep .pi { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pstep .pi svg { width: 13px; height: 13px; }
.pstep .st-tag { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-4); flex-shrink: 0; }
.pstep.done .pi { color: var(--brand); background: rgba(73,105,233,0.10); border: 1px solid rgba(73,105,233,0.28); }
html[data-theme="dark"] .pstep.done .pi { color: #9DB4FF; background: rgba(157,180,255,0.08); border-color: rgba(157,180,255,0.28); }
.pstep.active {
  color: var(--ink-1); font-weight: 700;
  background: linear-gradient(92deg, rgba(73,105,233,0.08), rgba(139,92,246,0.07));
  border: 1px solid rgba(109,111,246,0.22);
}
html[data-theme="dark"] .pstep.active { background: linear-gradient(92deg, rgba(99,130,255,0.12), rgba(139,92,246,0.10)); border-color: rgba(148,140,250,0.28); }
.pstep.active .st-tag { color: var(--brand); }
html[data-theme="dark"] .pstep.active .st-tag { color: #9DB4FF; }
.pstep.wait { color: var(--ink-4); }
.pstep.wait .pi { border: 1.5px dashed var(--divider); }
/* 进行中图标：呼吸光点 + 旋转细弧 */
.spin-arc { animation: arc-rot 1.6s linear infinite; transform-origin: center; }
@keyframes arc-rot { to { transform: rotate(360deg); } }
.breath-dot { animation: dot-breath 2.4s ease-in-out infinite alternate; }
@keyframes dot-breath { from { opacity: .45; } to { opacity: 1; } }
/* 2. 当前阶段说明 */
.phase-note {
  margin-top: 20px; display: flex; align-items: center; gap: 11px;
  padding: 13px 16px; border-radius: 14px;
  background: var(--chip-bg); border: 1px solid var(--chip-border);
}
.phase-note > svg { width: 16px; height: 16px; color: var(--brand); flex-shrink: 0; }
html[data-theme="dark"] .phase-note > svg { color: #9DB4FF; }
.phase-note b { display: block; font-size: 13px; font-weight: 700; }
.phase-note p { font-size: 12px; color: var(--ink-4); margin-top: 3px; }
/* 3. 3D 星盘仪（语言源自 01-entry 基准稿：玻璃盘面静态倾角 + 差速慢旋 + 陀螺浮动 + 鼠标视差） */
:root { --glass-disc: rgba(255, 255, 255, 0.30); }
html[data-theme="dark"] { --glass-disc: rgba(148, 166, 255, 0.055); }
.load-chart { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; padding: 24px 30px 24px 0; }
.chart3d {
  position: relative; width: 372px; height: 372px;
  perspective: 1400px; transform-style: preserve-3d;
  animation: stage-gyro 16s ease-in-out infinite alternate; transform-origin: 50% 46%;
}
@keyframes stage-gyro {
  from { transform: perspective(1300px) rotateX(7deg) rotateY(-9deg) translateY(0); }
  to { transform: perspective(1300px) rotateX(4deg) rotateY(-4deg) translateY(-9px); }
}
.chart3d .chart-halo { position: absolute; inset: -30px; background: var(--halo); border-radius: 50%; pointer-events: none; }
.chart3d .scene3d { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .38s cubic-bezier(.22,.61,.36,1); }
.chart3d .wheel-plane { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(18deg) rotateY(-11deg); }
.chart3d svg.wheel3d { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chart3d .chart-shadow {
  position: absolute; left: 50%; bottom: -8px; width: 280px; height: 42px;
  transform: translateX(-50%); filter: blur(12px); pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(15,23,42,0.18), transparent 68%);
  animation: shadow-breath 16s ease-in-out infinite alternate;
}
html[data-theme="dark"] .chart3d .chart-shadow { background: radial-gradient(ellipse at center, rgba(1,4,18,0.55), transparent 68%); }
@keyframes shadow-breath { from { transform: translateX(-50%) scaleX(1); opacity: .95; } to { transform: translateX(-50%) scaleX(.9); opacity: .6; } }
.chart3d .lens-sheen { position: absolute; inset: 6%; border-radius: 50%; overflow: hidden; pointer-events: none; }
.chart3d .lens-sheen::before {
  content: ""; position: absolute; top: -12%; bottom: -12%; width: 44%; left: -70%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,0.13) 44%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0.13) 56%, transparent);
  transform: skewX(-12deg); animation: sheen-sweep 17s linear infinite;
}
html[data-theme="dark"] .chart3d .lens-sheen::before { background: linear-gradient(100deg, transparent, rgba(190,200,255,0.08) 44%, rgba(216,222,255,0.15) 50%, rgba(190,200,255,0.08) 56%, transparent); }
@keyframes sheen-sweep { 0% { left: -70%; } 42% { left: 135%; } 100% { left: 135%; } }
/* 仪架差速慢旋（外环顺旋 160s / 虚线环逆旋 220s / 月光弧 46s） */
.chart3d .g-rotor { transform-box: view-box; transform-origin: 174px 174px; animation: rotor-spin 160s linear infinite; }
.chart3d .g-counter { transform-box: view-box; transform-origin: 174px 174px; animation: rotor-spin-rev 220s linear infinite; }
.chart3d .g-varc { transform-box: view-box; transform-origin: 174px 174px; animation: rotor-spin 46s linear infinite; }
@keyframes rotor-spin { to { transform: rotate(360deg); } }
@keyframes rotor-spin-rev { to { transform: rotate(-360deg); } }
/* 盘面元素 */
.chart3d .glass-disc { fill: var(--glass-disc); stroke: var(--ring); stroke-opacity: .5; }
.chart3d .ring-o { stroke: var(--ring); fill: none; }
.chart3d .tick { stroke: var(--tick); }
.chart3d .tick.major { stroke: var(--ring); }
.chart3d .star4 { fill: var(--star4); }
.chart3d .ring-dash { stroke: var(--dash); fill: none; }
.chart3d .spoke-ok { stroke: var(--ring); }
.chart3d .spoke-wait { stroke: var(--dash); }
.chart3d .pen { fill: var(--brand); }
.chart3d .pen.rose { fill: var(--err); }
.chart3d .pen-halo { fill: none; stroke: var(--brand); opacity: .5; }
.chart3d .pen-halo.rose { stroke: var(--err); }
.chart3d .pl { fill: var(--planet); }
.chart3d .pl-halo { fill: none; stroke: var(--planet); }
.chart3d .sun-c { fill: var(--sun); }
.chart3d .sun-h { fill: none; stroke: var(--sun); }
.chart3d .moon-c { fill: var(--moon); }
.chart3d .moon-h { fill: none; stroke: var(--moon); }
.chart3d .chord-ok-v { stroke: var(--aspect-v); fill: none; }
.chart3d .chord-ok-c { stroke: var(--aspect-c); fill: none; }
.chart3d .chord-wait { stroke: var(--dash); fill: none; }
.chart3d .zdiv { stroke: var(--violet); opacity: .38; }
.chart3d .zring { stroke: var(--violet); fill: none; opacity: .55; }
.chart3d .v-arc { stroke: var(--violet); fill: none; stroke-linecap: round; opacity: .75; }
/* 行星光晕错峰明灭（叶子元素，不压平 3D 链） */
.chart3d .tw { animation: twinkle 6.5s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .3; } to { opacity: .75; } }
/* 宫位线"持续绘制"（stroke-dashoffset 驱动，笔端光点同步上移） */
.chart3d .draw-spoke { stroke-dasharray: 100; stroke-dashoffset: 100; animation: spoke-grow 5.2s ease-in-out infinite; }
@keyframes spoke-grow {
  0% { stroke-dashoffset: 100; } 55% { stroke-dashoffset: 0; }
  82% { stroke-dashoffset: 0; opacity: 1; } 92% { opacity: .3; } 100% { stroke-dashoffset: 100; opacity: 1; }
}
.chart3d .draw-pen { animation: pen-move 5.2s ease-in-out infinite; }
@keyframes pen-move {
  0% { transform: translateY(0); } 55% { transform: translateY(-74px); }
  82% { transform: translateY(-74px); opacity: 1; } 92% { opacity: .3; } 100% { transform: translateY(0); opacity: 1; }
}
/* 相位线逐条连接出现（一次性，定格在已连接状态） */
.chart3d .chord-draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: chord-in 1.4s ease-out both; }
@keyframes chord-in { to { stroke-dashoffset: 0; } }
.chart-cap {
  position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
  font-size: 11.5px; font-weight: 700; white-space: nowrap;
  color: var(--chip-ink); background: var(--chip-bg); border: 1px solid var(--chip-border);
  border-radius: 999px; padding: 6px 13px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
/* 4. 流式解读占位（文字形 shimmer 条 + 极淡说明） */
.stream-card {
  position: relative; border-radius: 24px; overflow: hidden;
  background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
  padding: 18px 26px; display: flex; align-items: center; gap: 22px;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
}
.stream-card .sc-ic {
  width: 38px; height: 38px; border-radius: 13px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--chip-bg); border: 1px solid var(--chip-border); color: var(--violet);
}
.stream-card .sc-ic svg { width: 18px; height: 18px; }
.sc-lines { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.shim {
  height: 12px; border-radius: 6px;
  background: linear-gradient(90deg, var(--dash) 25%, var(--spoke) 50%, var(--dash) 75%);
  background-size: 220% 100%; animation: shimmer 2.2s linear infinite;
}
.shim:nth-child(1) { width: 88%; }

.shim:nth-child(3) { width: 54%; animation-delay: .5s; }
@keyframes shimmer { from { background-position: 170% 0; } to { background-position: -70% 0; } }
.sc-cap { font-size: 11.5px; color: var(--ink-4); white-space: nowrap; flex-shrink: 0; }
/* ══ 入场动效：用完即弃 ══ */
[data-enter="panel"] { animation: card-in 0.7s 0.05s both; }

@keyframes card-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes rise-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
/* 减少动态偏好：全部降级为静态 */

<script>
/* ══ 主题与缩放：?theme=dark&scale=2 ══ */
const qs = new URLSearchParams(location.search);
const theme = qs.get('theme') === 'dark' ? 'dark' : 'light';
document.documentElement.dataset.theme = theme;
if (qs.get('scale') === '2') {
  document.getElementById('stage').style.zoom = 2;
}

/* ══ 确定性伪随机（双主题/多次运行结果一致） ══ */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260806);

/* ══ 暗夜星野：细碎星光 + 少量十字星芒 ══ */
(function buildStarfield() {
  const sf = document.getElementById('starfield');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 130; i++) {
    const b = document.createElement('b');
    const s = rand();
    const size = s < 0.72 ? 1 : s < 0.94 ? 1.6 : 2.4;
    b.style.cssText = `left:${(rand() * 100).toFixed(2)}%;top:${(rand() * 100).toFixed(2)}%;` +
      `width:${size}px;height:${size}px;opacity:${(0.14 + rand() * 0.5).toFixed(2)}`;
    frag.appendChild(b);
  }
  const sparkPath = 'M0,-9 C1.1,-1.1 1.1,-1.1 9,0 C1.1,1.1 1.1,1.1 0,9 C-1.1,1.1 -1.1,1.1 -9,0 C-1.1,-1.1 -1.1,-1.1 0,-9 Z';
  for (let i = 0; i < 6; i++) {
    const sp = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    sp.setAttribute('viewBox', '-10 -10 20 20');
    sp.classList.add('spark');
    const scale = 0.5 + rand() * 0.7;
    sp.style.cssText = `left:${(rand() * 92 + 3).toFixed(2)}%;top:${(rand() * 88 + 4).toFixed(2)}%;` +
      `width:${(18 * scale).toFixed(0)}px;height:${(18 * scale).toFixed(0)}px;opacity:${(0.25 + rand() * 0.4).toFixed(2)}`;
    if (i === 2) sp.style.color = 'rgba(234, 201, 138, 0.85)';
    sp.innerHTML = `<path d="${sparkPath}" fill="currentColor"/>`;
    frag.appendChild(sp);
  }
  sf.appendChild(frag);
})();

/* ══ 暗夜主题：Logo 描边换浅色 ══ */
if (theme === 'dark') {
  const stops = document.querySelectorAll('#lg-ring stop');
  stops[0].setAttribute('stop-color', '#93C5FD');
  stops[1].setAttribute('stop-color', '#A5B4FC');
  document.querySelectorAll('.logo-dash').forEach(el => el.setAttribute('stroke', '#A5B4FC'));
  document.querySelectorAll('.logo-soft').forEach(el => el.setAttribute('stroke', '#64748B'));
  document.querySelectorAll('.logo-axis').forEach(el => el.setAttribute('stroke', '#D7DEF5'));
  document.querySelectorAll('.logo-diag').forEach(el => el.setAttribute('stroke', '#60A5FA'));
  document.querySelectorAll('.logo-core').forEach(el => el.setAttribute('fill', '#93C5FD'));
}

/* ══ 3D 星盘仪（含宫位·绘制中）：差速慢旋仪架 + 逐宫绘制 + 相位逐条连接 ══ */
(function buildSkel() {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('skelHouses');
  const C = 174;
  const pt = (a, r) => [C + r * Math.sin(a * Math.PI / 180), C - r * Math.cos(a * Math.PI / 180)];
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(n); return n;
  };
  // 玻璃基底盘面（让盘面读作一块有体量的仪器玻璃）
  el('circle', { cx: C, cy: C, r: 162, class: 'glass-disc', 'stroke-width': 1 });
  // 逆旋虚线环（220s）
  const gCounter = el('g', { class: 'g-counter' });
  el('circle', { cx: C, cy: C, r: 96, class: 'ring-dash', 'stroke-width': 1, 'stroke-dasharray': '2 5' }, gCounter);
  // 顺旋外环 + 60 刻度 + 十二星芒（160s）
  const gRotor = el('g', { class: 'g-rotor' });
  el('circle', { cx: C, cy: C, r: 150, class: 'ring-o', 'stroke-width': 1.3 }, gRotor);
  for (let i = 0; i < 60; i++) {
    const a = i * 6, major = i % 5 === 0;
    const [x1, y1] = pt(a, 150), [x2, y2] = pt(a, major ? 142.5 : 146);
    el('line', { x1, y1, x2, y2, class: major ? 'tick major' : 'tick', 'stroke-width': major ? 1.4 : 0.8 }, gRotor);
  }
  const star = 'M0,-5 C0.9,-0.9 0.9,-0.9 5,0 C0.9,0.9 0.9,0.9 0,5 C-0.9,0.9 -0.9,0.9 -5,0 C-0.9,-0.9 -0.9,-0.9 0,-5 Z';
  for (let k = 0; k < 12; k++) {
    const [x, y] = pt(k * 30 + 15, 132);
    el('path', { d: star, transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(0.85)`, class: 'star4', opacity: 0.9 }, gRotor);
  }
  // 宫位内环（固定仪架）
  el('circle', { cx: C, cy: C, r: 118, class: 'ring-o', 'stroke-width': 1, opacity: .75 });
  // 十二宫位线：0–4 已绘实线；第 6 宫持续绘制中；6–11 虚线待绘
  for (let k = 0; k < 12; k++) {
    if (k === 5) continue;
    const a = k * 30;
    const [x1, y1] = pt(a, 44), [x2, y2] = pt(a, 118);
    if (k < 5) {
      el('line', { x1, y1, x2, y2, class: 'spoke-ok', 'stroke-width': 1.2 });
    } else {
      el('line', { x1, y1, x2, y2, class: 'spoke-wait', 'stroke-width': 1, 'stroke-dasharray': '3 5' });
    }
  }
  // 第 6 宫（150°）：dashoffset 驱动延伸 + 笔端光点同步上移
  const g6 = el('g', { transform: `rotate(150 ${C} ${C})` });
  el('line', { x1: C, y1: C - 44, x2: C, y2: C - 118, class: 'spoke-ok draw-spoke', 'stroke-width': 1.2, pathLength: 100 }, g6);
  const pen = el('g', { class: 'draw-pen' }, g6);
  el('circle', { cx: C, cy: C - 44, r: 6, class: 'pen-halo', 'stroke-width': 1 }, pen);
  el('circle', { cx: C, cy: C - 44, r: 2.6, class: 'pen' }, pen);
  // 行星点（第 2 段真值，光晕错峰明灭）
  const planets = [
    { a: 35, c: 'sun-c', h: 'sun-h', R: 4.6 }, { a: 110, c: 'moon-c', h: 'moon-h', R: 4.2 },
    { a: 160, c: 'pl', h: 'pl-halo', R: 3.2 }, { a: 200, c: 'pl', h: 'pl-halo', R: 3 },
    { a: 250, c: 'pl', h: 'pl-halo', R: 3.2 }, { a: 300, c: 'pl', h: 'pl-halo', R: 2.8 },
  ];
  planets.forEach((p, i) => {
    const [x, y] = pt(p.a, 86);
    const halo = el('circle', { cx: x, cy: y, r: p.R + 4.5, class: p.h + ' tw', 'stroke-width': 1 });
    halo.style.animationDelay = (i * 0.7).toFixed(1) + 's';
    el('circle', { cx: x, cy: y, r: p.R, class: p.c });
  });
  // 关键相位：两条逐条连接出现（一次性），其余虚线待连
  const chord = (a1, a2, cls, w, dash, delay) => {
    const [x1, y1] = pt(a1, 86), [x2, y2] = pt(a2, 86);
    const attrs = { x1, y1, x2, y2, class: cls, 'stroke-width': w, pathLength: 100 };
    if (dash) attrs['stroke-dasharray'] = dash;
    const n = el('line', attrs);
    if (delay) n.style.animationDelay = delay;
  };
  chord(35, 160, 'chord-ok-v chord-draw', 1.2, null, '1s');
  chord(110, 250, 'chord-ok-c chord-draw', 1.1, null, '2.4s');
  chord(200, 300, 'chord-wait', 1, '3 5');
  chord(35, 250, 'chord-wait', 1, '3 5');
  // 中心星点
  el('circle', { cx: C, cy: C, r: 3, fill: 'var(--planet)' });
})();

/* ══ 入场动画用完即弃：animationend 后移除 data-enter（防冒泡误判需比对 target） ══ */
(function enterOnce() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-enter]').forEach(el => {
    el.addEventListener('animationend', e => {
      if (e.target === el) el.removeAttribute('data-enter');
    });
  });
})();

/* ══ 桌面端鼠标视差（±4°，reduced-motion 时不启用） ══ */
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const panelEl = document.querySelector('.load-panel');
  const sceneEl = document.getElementById('scene3d');
  panelEl.addEventListener('mousemove', e => {
    const r = panelEl.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    sceneEl.style.transform = `rotateX(${(-y * 4).toFixed(2)}deg) rotateY(${(x * 5).toFixed(2)}deg)`;
  });
  panelEl.addEventListener('mouseleave', () => { sceneEl.style.transform = ''; });
}
</script>
