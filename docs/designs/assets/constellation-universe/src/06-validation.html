<style>
/* ══════════════════════════════════════════════════════════════
   星座寰宇 · 双主题设计基准 —— 模块入口页
   壳层逐像素复刻 AI STUDIO 系统导航 + 命理大师模块侧栏
   ══════════════════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  /* ── 浅色主题：适配系统主体（雾白 / 浅蓝 / 蓝—靛渐变） ── */
  --page-bg: #F5F7FA;
  --glow-a: rgba(219, 234, 254, 0.62);
  --glow-b: rgba(233, 213, 255, 0.34);
  --glow-c: rgba(191, 219, 254, 0.34);
  --ink-1: #0F172A; --ink-2: #475569; --ink-3: #64748B; --ink-4: #94A3B8;
  --brand: #4969E9; --brand-2: #7B8FFF; --indigo: #6366F1; --violet: #8B5CF6;
  --cyan: #06B6D4; --gold: #C99645;
  --sysnav-bg: rgba(255, 255, 255, 0.72);
  --sysnav-border: rgba(255, 255, 255, 0.70);
  --panel-bg: rgba(255, 255, 255, 0.55);
  --panel-border: rgba(255, 255, 255, 0.66);
  --panel-shadow: 0 20px 44px -18px rgba(59, 130, 246, 0.12), 0 6px 16px -8px rgba(15, 23, 42, 0.05);
  --hero-bg: linear-gradient(158deg, rgba(255,255,255,0.78) 0%, rgba(255,255,255,0.42) 46%, rgba(240,245,255,0.34) 100%);
  --hero-border: rgba(255, 255, 255, 0.68);
  --hero-shadow: 0 24px 52px -18px rgba(59, 130, 246, 0.15), 0 8px 22px -10px rgba(15, 23, 42, 0.06);
  --card-bg: #FFFFFF; --card-border: rgba(226, 232, 240, 0.95);
  --card-shadow: 0 12px 28px -14px rgba(59, 130, 246, 0.10), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
  --chip-bg: rgba(255, 255, 255, 0.78); --chip-border: rgba(199, 210, 254, 0.9); --chip-ink: #4E67E6;
  --ring: #CBD5F4; --tick: #C2CDEE; --spoke: #E4EAF9; --dash: #D9E1F7; --star4: #BDC9F0;
  --aspect-v: rgba(139, 92, 246, 0.40); --aspect-c: rgba(6, 182, 212, 0.36);
  --planet: #818CF8; --sun: #E7A93E; --moon: #7E96C8;
  --halo: radial-gradient(circle, rgba(99,102,241,0.16) 0%, rgba(99,102,241,0.05) 55%, transparent 72%);

  --divider: rgba(148, 163, 184, 0.30);
  --starfield-opacity: 0;
}
html[data-theme="dark"] {
  /* ── 暗夜星空：午夜蓝 × 紫罗兰深空星云 + 星光金点缀 ── */

  --glow-a: rgba(63, 82, 220, 0.24);
  --glow-b: rgba(124, 88, 236, 0.20);
  --glow-c: rgba(30, 48, 140, 0.30);
  --ink-1: #EDEFFA; --ink-2: #C4C9E5; --ink-3: #9AA1C9; --ink-4: #6D74A0;
  --brand: #6D8BFF; --brand-2: #8B5CF6; --indigo: #818CF8; --violet: #A78BFA;
  --cyan: #67E8F9; --gold: #EAC98A;
  --sysnav-bg: rgba(12, 17, 42, 0.66);
  --sysnav-border: rgba(255, 255, 255, 0.07);
  --panel-bg: rgba(15, 21, 52, 0.58);
  --panel-border: rgba(255, 255, 255, 0.09);
  --panel-shadow: 0 26px 60px -22px rgba(1, 4, 18, 0.85), 0 0 90px -40px rgba(99, 102, 241, 0.30);
  --hero-bg: linear-gradient(156deg, rgba(38, 47, 104, 0.52) 0%, rgba(17, 23, 58, 0.46) 48%, rgba(27, 20, 68, 0.42) 100%);
  --hero-border: rgba(255, 255, 255, 0.10);
  --hero-shadow: 0 32px 84px -26px rgba(1, 4, 18, 0.88), 0 0 130px -34px rgba(109, 99, 246, 0.32);
  --card-bg: rgba(21, 28, 68, 0.66); --card-border: rgba(255, 255, 255, 0.09);
  --card-shadow: 0 18px 44px -20px rgba(1, 4, 18, 0.80), 0 0 70px -36px rgba(99, 102, 241, 0.28);
  --chip-bg: rgba(255, 255, 255, 0.06); --chip-border: rgba(255, 255, 255, 0.13); --chip-ink: #C9CFF1;
  --ring: rgba(156, 168, 255, 0.40); --tick: rgba(156, 168, 255, 0.24); --spoke: rgba(156, 168, 255, 0.13);
  --dash: rgba(156, 168, 255, 0.19); --star4: rgba(196, 205, 255, 0.38);
  --aspect-v: rgba(167, 139, 250, 0.48); --aspect-c: rgba(103, 232, 249, 0.40);
  --planet: #A5B4FC; --sun: #EAC98A; --moon: #DCE6FF;
  --halo: radial-gradient(circle, rgba(129,140,248,0.22) 0%, rgba(139,92,246,0.09) 52%, transparent 74%);
  --dust: rgba(203, 213, 255, 0.55);
  --divider: rgba(148, 163, 255, 0.16);
  --starfield-opacity: 1;
}
html, body { height: 100%; }
body {
  font-family: "DM Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--page-bg);
  color: var(--ink-1);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.stage { width: 1600px; height: 1000px; position: relative; overflow: hidden; }
/* ── 环境光 ── */
.ambient { position: absolute; inset: 0; pointer-events: none; }
.ambient i { position: absolute; border-radius: 50%; filter: blur(70px); }
.ambient .a1 { width: 900px; height: 640px; right: -180px; top: -220px; background: var(--glow-a); }
.ambient .a2 { width: 760px; height: 620px; left: -240px; bottom: -260px; background: var(--glow-b); }
.ambient .a3 { width: 620px; height: 520px; right: 260px; bottom: -240px; background: var(--glow-c); }
html[data-theme="dark"] .ambient .a1 { filter: blur(110px); }
html[data-theme="dark"] .ambient .a2 { filter: blur(120px); }
html[data-theme="dark"] .ambient .a3 { filter: blur(120px); }
.starfield { position: absolute; inset: 0; pointer-events: none; opacity: var(--starfield-opacity); transition: opacity .4s; }
.starfield b { position: absolute; border-radius: 50%; background: #DDE4FF; }
.starfield .spark { position: absolute; color: rgba(226, 232, 255, 0.85); }
/* ══ 布局骨架 ══ */
.app { position: relative; display: grid; grid-template-columns: 100px 1fr; height: 1000px; }
.main { display: grid; grid-template-columns: 304px 1fr; height: 1000px; }
/* ══ 左侧 AI STUDIO 系统导航（既有，逐像素复刻） ══ */
.sysnav {
  position: relative; z-index: 5;
  background: var(--sysnav-bg);
  border-right: 1px solid var(--sysnav-border);
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  display: flex; flex-direction: column; align-items: center;
  padding: 18px 0 16px;
}
.sysnav .logo { display: flex; flex-direction: column; align-items: center; gap: 7px; margin-bottom: 26px; }
.sysnav .logo .mark { width: 46px; height: 46px; }
.sysnav .logo span { font-size: 10px; letter-spacing: 0.24em; font-weight: 700; color: var(--ink-4); }
.nav-items { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; width: 100%; }
.nav-it { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; padding: 8px 0 7px; color: var(--ink-3); }
.nav-it svg { width: 23px; height: 23px; stroke-width: 1.75; }
.nav-it em { font-style: normal; font-size: 12px; line-height: 1; }
.nav-it .ic { width: 44px; height: 44px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
.nav-it.active { color: var(--brand); }
html[data-theme="dark"] .nav-it.active { color: #9DB4FF; }
.nav-it.active .ic {
  background: linear-gradient(135deg, #4969E9 0%, #7B8FFF 100%);
  color: #fff; box-shadow: 0 10px 20px -6px rgba(73, 105, 233, 0.45);
}
.nav-it.active::before {
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 4px; height: 58px; border-radius: 0 4px 4px 0; background: #6B83FA;
}
.nav-it.action { margin-top: 6px; color: var(--ink-3); }
.nav-bottom { display: flex; flex-direction: column; align-items: center; gap: 20px; color: var(--ink-4); }
.nav-bottom svg { width: 21px; height: 21px; stroke-width: 1.7; }
.nav-bottom .me { position: relative; }
.nav-bottom .me i { position: absolute; top: 0; right: 1px; width: 7px; height: 7px; border-radius: 50%; background: #F26D8D; border: 1.5px solid #fff; }
html[data-theme="dark"] .nav-bottom .me i { border-color: #0B1130; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #1B1B1F; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
html[data-theme="dark"] .avatar { background: linear-gradient(135deg, #2A3568, #4C3A86); border: 1px solid rgba(255,255,255,.14); }
/* ══ 命理大师模块侧栏（既有 + 第四项） ══ */
.modnav-wrap { padding: 20px 0 20px 24px; height: 1000px; }
.modnav {
  position: relative; height: 100%; border-radius: 28px;
  background: var(--panel-bg); border: 1px solid var(--panel-border);
  box-shadow: var(--panel-shadow);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  padding: 22px 16px; display: flex; flex-direction: column; gap: 24px;
}
.modnav .head { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.modnav .head .bib {
  width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.70); border: 1px solid rgba(255,255,255,0.55); box-shadow: 0 2px 6px rgba(15,23,42,0.05);
  color: #4969E9;
}
html[data-theme="dark"] .modnav .head .bib { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.10); color: #9DB4FF; box-shadow: none; }
.modnav .head h3 { font-size: 14px; font-weight: 800; }
.modnav .head p { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.modnav .collapse {
  position: absolute; right: -11px; top: 54px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: 0 2px 6px rgba(15,23,42,.08);
  color: var(--ink-4); font-size: 13px; display: flex; align-items: center; justify-content: center; line-height: 1;
}
.modnav .group-label { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: var(--ink-4); padding: 0 6px; margin-bottom: 12px; }
.mod-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  border-radius: 16px; padding: 10px 12px; border: 1px solid transparent;
  text-align: left; background: transparent; margin-bottom: 8px;
}
.mod-item .ib {
  width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.52);
  color: #5B6B8C;
}
html[data-theme="dark"] .mod-item .ib { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.09); color: #B9C0E2; }
.mod-item .ib svg { width: 20px; height: 20px; }
.mod-item b { display: block; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.mod-item small { display: block; font-size: 12px; color: var(--ink-4); margin-top: 2px; }
.mod-item.active {
  background: linear-gradient(92deg, rgba(79, 109, 245, 0.13) 0%, rgba(139, 92, 246, 0.11) 100%);
  border-color: rgba(109, 111, 246, 0.30);
  box-shadow: 0 6px 16px -8px rgba(99, 102, 241, 0.35);
}
.mod-item.active b { color: var(--ink-1); }
.mod-item.active .ib {
  background: linear-gradient(135deg, #4F6DF5 0%, #8B5CF6 100%);
  border-color: transparent; color: #fff;
  box-shadow: 0 8px 18px -4px rgba(109, 99, 246, 0.50);
}
html[data-theme="dark"] .mod-item.active {
  background: linear-gradient(92deg, rgba(99, 130, 255, 0.18) 0%, rgba(139, 92, 246, 0.16) 100%);
  border-color: rgba(148, 140, 250, 0.36);
  box-shadow: 0 0 26px -6px rgba(124, 108, 246, 0.40);
}
</style>
<style>
/* ══ 右侧内容区 ══ */
.content { position: relative; padding: 20px 24px 20px 24px; height: 1000px; display: flex; flex-direction: column; gap: 18px; }
/* 页头：与命理各模块同规格 */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 4px 6px 0; }
.page-head .ttl { display: flex; align-items: center; gap: 12px; }
.page-head h1 { font-size: 29px; font-weight: 800; letter-spacing: -0.01em; }
.phase-badge {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 13px;
  font-size: 12px; font-weight: 700;
  background: rgba(99, 102, 241, 0.10); color: #5457E8; border: 1px solid rgba(99,102,241,0.14);
}
html[data-theme="dark"] .phase-badge { background: rgba(129, 140, 248, 0.14); color: #B9C2FF; border-color: rgba(129,140,248,0.20); }
.phase-badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.page-head .sub { margin-top: 7px; font-size: 14px; color: var(--ink-3); }
/* 模型切换（既有组件） */
.model-switch {
  display: flex; align-items: center; gap: 2px; padding: 3px;
  border-radius: 999px; background: var(--panel-bg); border: 1px solid var(--panel-border);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 4px 12px -6px rgba(15,23,42,0.08);
}
.model-switch span { padding: 7px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-3); }
.model-switch span.on {
  color: #fff; background: linear-gradient(135deg, #3D63F0, #5E7BFF);
  box-shadow: 0 6px 14px -4px rgba(61, 99, 240, 0.45);
}
/* ══════════════════════════════════════════════════════════════
   出生时空 2/2 —— 字段校验状态（V3.1 §9.6，错误只在对应字段原位呈现）
   ══════════════════════════════════════════════════════════════ */
/* ── 表单页补充 token ── */
:root {
  --input-bg: rgba(247, 249, 255, 0.92);
  --input-border: rgba(198, 208, 236, 0.95);
  --ok-ring: rgba(73, 105, 233, 0.12);
  --wm-opacity: 0.55;
  --tzbar-bg: rgba(73, 105, 233, 0.07); --tzbar-border: rgba(73, 105, 233, 0.16);
}
html[data-theme="dark"] {
  --input-bg: rgba(9, 13, 38, 0.55);
  --input-border: rgba(255, 255, 255, 0.13);
  --ok-ring: rgba(109, 139, 255, 0.16);
  --wm-opacity: 0.6;
  --tzbar-bg: rgba(157, 180, 255, 0.08); --tzbar-border: rgba(157, 180, 255, 0.16);
}
/* ══ 表单舞台：极淡圆形星轨水印 + 居中档案卡 ══ */
.form-wrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
/* 水印：细线同心圆 + 刻度，径向渐隐，透明度极低，不影响输入阅读 */
.orbit-wm {
  position: absolute; left: 50%; top: 50%; width: 800px; height: 800px;
  transform: translate(-50%, -50%); opacity: var(--wm-opacity); pointer-events: none;
  /* §9.6：错误字段（出生城市）附近水印断开一小段 —— 径向渐隐 × 断口两层 mask 交叠 */
  -webkit-mask-image: radial-gradient(circle, #000 26%, transparent 70%), radial-gradient(circle at 50% 63%, transparent 0 56px, #000 84px);
  -webkit-mask-composite: source-in;
  mask-image: radial-gradient(circle, #000 26%, transparent 70%), radial-gradient(circle at 50% 63%, transparent 0 56px, #000 84px);
  mask-composite: intersect;
}
.orbit-wm circle { fill: none; }
.orbit-wm .w1 { stroke: var(--ring); }
.orbit-wm .w2 { stroke: var(--tick); }
.orbit-wm .w3 { stroke: var(--dash); }
/* 实体表单卡：被星图轻轻照亮的档案页 */
.form-card {
  position: relative; width: 640px; border-radius: 28px; overflow: hidden;
  background: var(--card-bg); border: 1px solid var(--card-border);
  box-shadow: var(--card-shadow), 0 0 110px -34px rgba(99, 102, 241, 0.30);
  padding: 28px 38px 26px;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.form-card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
}
html[data-theme="dark"] .form-card::before { background: linear-gradient(90deg, transparent, rgba(210,220,255,0.40), transparent); }
.edge-glow { position: absolute; width: 300px; height: 220px; right: -90px; top: -100px; border-radius: 50%; filter: blur(64px); background: var(--glow-a); pointer-events: none; }
/* 1. 步骤指示：第一步已完成（蓝对勾），第二步激活 */
.steps { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.step { display: flex; align-items: center; gap: 10px; }
.step .sd { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
.step .sd svg { width: 14px; height: 14px; }
.step.on .sd { color: #fff; background: linear-gradient(135deg, #4969E9, #7B8FFF); box-shadow: 0 6px 14px -4px rgba(73,105,233,0.5); }
.step.done .sd { color: var(--brand); background: rgba(73,105,233,0.10); border: 1px solid rgba(73,105,233,0.30); }
html[data-theme="dark"] .step.done .sd { color: #9DB4FF; background: rgba(157,180,255,0.08); border-color: rgba(157,180,255,0.30); }
.step .st b { display: block; font-size: 14px; font-weight: 800; }
.step .st i { display: block; font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; margin-top: 1px; }
.step.on .st i { color: var(--brand); }
html[data-theme="dark"] .step.on .st i { color: #9DB4FF; }
.step.done .st b { color: var(--ink-2); font-weight: 700; }
.step.done .st i { color: var(--ink-4); }
.steps .sl { flex: 1; max-width: 96px; height: 1px; background: repeating-linear-gradient(90deg, var(--divider) 0 5px, transparent 5px 10px); }
/* 通用字段样式 */
.field { margin-bottom: 16px; }
.field-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.field-head label { font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.tag { font-size: 11px; font-weight: 700; padding: 2.5px 9px; border-radius: 999px; }
.tag.req { color: var(--brand); background: rgba(73,105,233,0.08); border: 1px solid rgba(73,105,233,0.20); }
html[data-theme="dark"] .tag.req { color: #9DB4FF; background: rgba(157,180,255,0.10); border-color: rgba(157,180,255,0.26); }
.input-wrap { position: relative; }
.input-wrap input {
  width: 100%; height: 48px; border-radius: 15px; padding: 0 46px 0 42px;
  font-family: inherit; font-size: 15px; color: var(--ink-1);
  background: var(--input-bg); border: 1.5px solid var(--input-border); outline: none;
}
.input-wrap input::placeholder { color: var(--ink-4); }
.input-wrap .ic-l { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--ink-4); }
.input-wrap .ic-ok { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--brand); }
html[data-theme="dark"] .input-wrap .ic-ok { color: #9DB4FF; }
.input-wrap.done input { border-color: var(--brand); box-shadow: 0 0 0 3.5px var(--ok-ring); }
.hint { margin-top: 7px; font-size: 12px; color: var(--ink-4); display: flex; align-items: center; gap: 6px; }
.hint svg { width: 13px; height: 13px; flex-shrink: 0; }
/* ══ §9.6 字段校验：柔和玫瑰红仅限错误字段小面积使用 ══ */
:root { --err: #D96A7E; --err-ring: rgba(217, 106, 126, 0.16); }
html[data-theme="dark"] { --err: #E58A9B; --err-ring: rgba(229, 138, 155, 0.22); }
/* 错误字段：玫瑰红边框 + 清晰焦点环；160ms 横向 4px 微位移只播一次 */
.input-wrap.error input { border-color: var(--err); box-shadow: 0 0 0 3.5px var(--err-ring); }
.input-wrap .ic-err { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--err); }
.shake { animation: field-shake 0.16s ease-in-out 1; }
@keyframes field-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
/* 字段下方短中文修正说明 */
.err-note { margin-top: 7px; font-size: 12px; font-weight: 600; color: var(--err); display: flex; align-items: center; gap: 6px; }
.err-note svg { width: 13px; height: 13px; flex-shrink: 0; }
/* 城市无效时：时区条不显示确认信息，替换为灰色待确认占位条 */
.flow-line.pending { background: repeating-linear-gradient(180deg, var(--ink-4) 0 3px, transparent 3px 7px); opacity: .38; }
.tzbar.pending { background: rgba(148,163,184,0.07); border: 1px dashed var(--divider); color: var(--ink-4); }
.tzbar.pending > svg { color: var(--ink-4); }
@media (prefers-reduced-motion: reduce) { .shake { animation: none !important; } }
/* 2. 时间精度三档单选（分段控件样式） */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.seg .opt {
  display: flex; align-items: center; gap: 9px; padding: 11px 13px; border-radius: 14px;
  background: var(--input-bg); border: 1.5px solid var(--input-border);
  font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer;
}
.seg .opt .rd { position: relative; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink-4); flex-shrink: 0; }
.seg .opt.on {
  border-color: var(--brand); color: var(--ink-1);
  background: linear-gradient(92deg, rgba(73,105,233,0.07), rgba(139,92,246,0.06));
  box-shadow: 0 0 0 3px var(--ok-ring);
}
.seg .opt.on .rd { border-color: var(--brand); }
.seg .opt.on .rd::after { content: ""; position: absolute; inset: 3.5px; border-radius: 50%; background: var(--brand); }
html[data-theme="dark"] .seg .opt.on { border-color: #6D8BFF; }
html[data-theme="dark"] .seg .opt.on .rd { border-color: #6D8BFF; }
html[data-theme="dark"] .seg .opt.on .rd::after { background: #6D8BFF; }
/* 3. 条件时间输入：时/分选择器 + 时间校准台小组件 */
.time-row { display: flex; gap: 20px; align-items: center; }
.time-inputs { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.hm { display: flex; align-items: center; gap: 10px; }
.hm .unit {
  flex: 1; height: 48px; border-radius: 15px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 13px 0 16px; background: var(--input-bg); border: 1.5px solid var(--brand); box-shadow: 0 0 0 3.5px var(--ok-ring);
}
.hm .unit b { font-size: 16px; font-weight: 800; color: var(--ink-1); }
.hm .unit b small { font-size: 12px; font-weight: 600; color: var(--ink-4); margin-left: 4px; }
.hm .unit svg { width: 15px; height: 15px; color: var(--ink-4); }
.hm .sep { font-size: 19px; font-weight: 800; color: var(--ink-4); }
/* 圆形时钟—星盘混合刻度：克制、浅色科技感，占星元素只作结构性细节 */
.twidget { position: relative; width: 150px; height: 150px; flex-shrink: 0; }
.twidget svg { width: 100%; height: 100%; display: block; overflow: visible; }
.twidget .tick { stroke: var(--tick); }
.twidget .tick.major { stroke: var(--ring); }
.twidget .ring-o { stroke: var(--ring); fill: none; }
.twidget .ring-d { stroke: var(--dash); fill: none; }
.twidget .hand-h { stroke: var(--ink-4); stroke-linecap: round; }
.twidget .hand-m { stroke: var(--brand); stroke-linecap: round; }
.twidget .arc-sel { stroke: var(--brand); fill: none; stroke-linecap: round; }
.twidget .ctr { fill: var(--brand); }
.twidget .cap {
  position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%);
  font-size: 11px; font-weight: 700; color: var(--brand); white-space: nowrap;
  background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 999px; padding: 3px 10px;
}
html[data-theme="dark"] .twidget .cap { color: #9DB4FF; }
/* 5. 时区确认信息条（低饱和蓝）+ 从城市字段流向信息条的细线 */
.flow-line { width: 1.5px; height: 14px; margin-left: 27px;
  background: repeating-linear-gradient(180deg, var(--brand) 0 3px, transparent 3px 7px); opacity: .65; }
.tzbar {
  display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-radius: 14px;
  background: var(--tzbar-bg); border: 1px solid var(--tzbar-border);
  font-size: 13px; color: var(--ink-2);
}
.tzbar > svg { width: 15px; height: 15px; color: var(--brand); flex-shrink: 0; }
html[data-theme="dark"] .tzbar > svg { color: #9DB4FF; }
.tzbar b { font-weight: 700; color: var(--ink-1); }
.tzbar .flow-tag { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--brand); white-space: nowrap; }
html[data-theme="dark"] .tzbar .flow-tag { color: #9DB4FF; }
.tzbar .flow-tag svg { width: 12px; height: 12px; }
/* 6. 资料影响提示（可展开，收起态） */
.impact {
  display: flex; align-items: center; gap: 9px; padding: 10px 14px; border-radius: 13px;
  border: 1px dashed var(--divider); color: var(--ink-3); font-size: 12.5px;
}
.impact > svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--ink-4); }
.impact .chev { margin-left: auto; width: 15px; height: 15px; color: var(--ink-4); flex-shrink: 0; }
/* 7. 操作区：主按钮 + 次按钮（≥44px 热区） */
.actions { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 7px; height: 46px; padding: 0 18px; border-radius: 999px;
  font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink-3);
  background: transparent; border: 1px solid var(--divider); cursor: pointer;
}
.btn-ghost svg { width: 15px; height: 15px; }
.btn-primary {
  position: relative; display: inline-flex; align-items: center; gap: 9px;
  height: 50px; padding: 0 28px; border-radius: 999px; border: none; cursor: pointer;
  font-size: 15px; font-weight: 700; color: #fff; font-family: inherit;
  background: linear-gradient(120deg, #4969E9 0%, #6F63F6 58%, #8B5CF6 100%);
  box-shadow: 0 16px 30px -10px rgba(86, 99, 240, 0.55), 0 4px 10px -3px rgba(86, 99, 240, 0.30);
  overflow: hidden;
}
.btn-primary::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 1px; background: rgba(255,255,255,0.45); }
.btn-primary .pulse { position: absolute; inset: -3px; border-radius: inherit; pointer-events: none; box-shadow: 0 0 0 0 rgba(124, 108, 246, 0.35); }
.btn-primary svg { width: 17px; height: 17px; }
/* ══ 入场动效：用完即弃（animationend 后由 JS 移除 data-enter） ══ */
[data-enter="card"] { animation: card-in 0.7s 0.05s both; }
[data-enter="steps"] { animation: rise-in 0.55s 0.18s both; }
[data-enter="f1"] { animation: rise-in 0.55s 0.28s both; }
[data-enter="f2"] { animation: rise-in 0.55s 0.38s both; }
[data-enter="f3"] { animation: rise-in 0.55s 0.48s both; }
[data-enter="f4"] { animation: rise-in 0.55s 0.58s both; }
[data-enter="f5"] { animation: rise-in 0.55s 0.68s both; }
[data-enter="f6"] { animation: rise-in 0.55s 0.78s both; }
@keyframes card-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes rise-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
.btn-primary .pulse { animation: cta-pulse 1.9s 1.6s 2 both; }
@keyframes cta-pulse { 0% { box-shadow: 0 0 0 0 rgba(124,108,246,0.45); } 70% { box-shadow: 0 0 0 15px rgba(124,108,246,0); } 100% { box-shadow: 0 0 0 0 rgba(124,108,246,0); } }
/* 减少动态偏好：全部降级为静态 */
@media (prefers-reduced-motion: reduce) {
  [data-enter], .btn-primary .pulse { animation: none !important; }
}
</style>

            <div class="field" data-enter="f4">
              <i class="flow-line pending"></i>
              <div class="tzbar pending">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.3 3.9 5.2 3.9 8.5s-1.3 6.2-3.9 8.5c-2.6-2.3-3.9-5.2-3.9-8.5s1.3-6.2 3.9-8.5Z"/></svg>
                <span>选择候选城市后确认时区</span>
              </div>
            </div>
            <!-- 6. 资料影响提示（可展开，收起态） -->
            <div class="field" data-enter="f5">
              <div class="impact">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 10.8V17M12 7.2v.3"/></svg>
                时间影响上升、宫位与天顶；不知道时间时，我们不会生成这些内容。
                <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></svg>
              </div>
            </div>
            <!-- 7. 操作区：主按钮 + 次按钮 -->
            <div class="actions" data-enter="f6">
              <button class="btn-ghost" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12h-15M11 5.5 4.5 12l6.5 6.5"/></svg>返回上一步</button>
              <button class="btn-primary" type="button"><span class="pulse"></span>绘制我的星盘<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.9 5.4 4.6 9.1 10 10-5.4.9-9.1 4.6-10 10-.9-5.4-4.6-9.1-10-10 5.4-.9 9.1-4.6 10-10Z"/></svg></button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
</div>
<script>
/* ══ 主题与缩放：?theme=dark&scale=2 ══ */
const qs = new URLSearchParams(location.search);
const theme = qs.get('theme') === 'dark' ? 'dark' : 'light';
document.documentElement.dataset.theme = theme;
if (qs.get('scale') === '2') {
  document.getElementById('stage').style.zoom = 2;
}

/* ══ 确定性伪随机（双主题/多次运行结果一致） ══ */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260806);

/* ══ 暗夜星野：细碎星光 + 少量十字星芒 ══ */
(function buildStarfield() {
  const sf = document.getElementById('starfield');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 130; i++) {
    const b = document.createElement('b');
    const s = rand();
    const size = s < 0.72 ? 1 : s < 0.94 ? 1.6 : 2.4;
    b.style.cssText = `left:${(rand() * 100).toFixed(2)}%;top:${(rand() * 100).toFixed(2)}%;` +
      `width:${size}px;height:${size}px;opacity:${(0.14 + rand() * 0.5).toFixed(2)}`;
    frag.appendChild(b);
  }
  const sparkPath = 'M0,-9 C1.1,-1.1 1.1,-1.1 9,0 C1.1,1.1 1.1,1.1 0,9 C-1.1,1.1 -1.1,1.1 -9,0 C-1.1,-1.1 -1.1,-1.1 0,-9 Z';
  for (let i = 0; i < 6; i++) {
    const sp = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    sp.setAttribute('viewBox', '-10 -10 20 20');
    sp.classList.add('spark');
    const scale = 0.5 + rand() * 0.7;
    sp.style.cssText = `left:${(rand() * 92 + 3).toFixed(2)}%;top:${(rand() * 88 + 4).toFixed(2)}%;` +
      `width:${(18 * scale).toFixed(0)}px;height:${(18 * scale).toFixed(0)}px;opacity:${(0.25 + rand() * 0.4).toFixed(2)}`;
    if (i === 2) sp.style.color = 'rgba(234, 201, 138, 0.85)';
    sp.innerHTML = `<path d="${sparkPath}" fill="currentColor"/>`;
    frag.appendChild(sp);
  }
  sf.appendChild(frag);
})();

/* ══ 暗夜主题：Logo 描边换浅色 ══ */
if (theme === 'dark') {
  const stops = document.querySelectorAll('#lg-ring stop');
  stops[0].setAttribute('stop-color', '#93C5FD');
  stops[1].setAttribute('stop-color', '#A5B4FC');
  document.querySelectorAll('.logo-dash').forEach(el => el.setAttribute('stroke', '#A5B4FC'));
  document.querySelectorAll('.logo-soft').forEach(el => el.setAttribute('stroke', '#64748B'));
  document.querySelectorAll('.logo-axis').forEach(el => el.setAttribute('stroke', '#D7DEF5'));
  document.querySelectorAll('.logo-diag').forEach(el => el.setAttribute('stroke', '#60A5FA'));
  document.querySelectorAll('.logo-core').forEach(el => el.setAttribute('fill', '#93C5FD'));
}

/* ══ 时间校准台：60 分钟刻度 + 选中分钟收敛高亮（细蓝弧指向 14:35） ══ */
(function buildClock() {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('clockExact');
  const C = 80;
  // 角度约定：0° 为正上方（12 点方向），顺时针
  const pt = (a, r) => [C + r * Math.sin(a * Math.PI / 180), C - r * Math.cos(a * Math.PI / 180)];
  const el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    svg.appendChild(n); return n;
  };
  // 外圈（星盘仪器环）
  el('circle', { cx: C, cy: C, r: 72, class: 'ring-o', 'stroke-width': 1.2 });
  // 60 分钟刻度（每 5 分钟一根主刻度）
  for (let i = 0; i < 60; i++) {
    const a = i * 6, major = i % 5 === 0;
    const [x1, y1] = pt(a, 72), [x2, y2] = pt(a, major ? 63.5 : 67);
    el('line', { x1, y1, x2, y2, class: major ? 'tick major' : 'tick', 'stroke-width': major ? 1.4 : 0.8 });
  }
  // 内圈虚线环（星盘结构细节）
  el('circle', { cx: C, cy: C, r: 40, class: 'ring-d', 'stroke-width': 1, 'stroke-dasharray': '2 5' });
  // 选中分钟高亮：外圈一道细蓝弧指向 35 分（210°）位置
  const [ax1, ay1] = pt(196, 72), [ax2, ay2] = pt(224, 72);
  el('path', { d: `M ${ax1} ${ay1} A 72 72 0 0 1 ${ax2} ${ay2}`, class: 'arc-sel', 'stroke-width': 2.6 });
  // 时针（短针，14 时 → 77.5°）与分针（长针，35 分 → 210°）
  const [hx1, hy1] = pt(77.5, 22), [hx2, hy2] = pt(77.5, 38);
  el('line', { x1: hx1, y1: hy1, x2: hx2, y2: hy2, class: 'hand-h', 'stroke-width': 2.4 });
  const [mx1, my1] = pt(210, 16), [mx2, my2] = pt(210, 58);
  el('line', { x1: mx1, y1: my1, x2: mx2, y2: my2, class: 'hand-m', 'stroke-width': 1.6 });
  el('circle', { cx: mx2, cy: my2, r: 3, fill: 'var(--brand)' });
  // 中心点
  el('circle', { cx: C, cy: C, r: 3, class: 'ctr' });
})();

/* ══ 入场动画用完即弃：animationend 后移除 data-enter（防冒泡误判需比对 target） ══ */
(function enterOnce() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-enter]').forEach(el => {
    el.addEventListener('animationend', e => {
      if (e.target === el) el.removeAttribute('data-enter');
    });
  });
})();
</script>
</body>
