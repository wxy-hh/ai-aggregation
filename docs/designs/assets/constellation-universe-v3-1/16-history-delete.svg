<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">星座寰宇 · 统一历史删除确认</title>
  <desc id="desc">桌面和移动端统一历史记录中的删除确认状态。仅嵌入现有系统导航与命理大师模块侧栏，不重绘导航。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9FBFF"/>
      <stop offset="1" stop-color="#EDF2FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#F8FAFF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4969E9"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#4969E9" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172033" flood-opacity="0.05"/>
    </filter>
  </defs>
  <rect width="1440" height="860" fill="url(#page)"/>
  <circle cx="156" cy="94" r="210" fill="#DDE7FF" opacity="0.55"/>
  <circle cx="1340" cy="772" r="230" fill="#E6E0FF" opacity="0.6"/>

  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="68" y="46" width="193" height="28" rx="14" fill="#EEF2FF"/>
    <text x="80" y="65" font-size="12" font-weight="700" fill="#4969E9">P0 · 右侧内容区视觉稿</text>
    <text x="68" y="101" font-size="30" font-weight="800" fill="#172033">星座寰宇 · 统一历史删除确认</text>
    <text x="68" y="124" font-size="13" font-weight="550" fill="#6D7A92">仅在统一历史中删除，且级联清除资产</text>
    <text x="976" y="101" font-size="13" font-weight="800" fill="#4969E9">移动端内容区</text>

    <rect x="68" y="130" width="790" height="106" rx="30" fill="url(#glass)" stroke="#FFFFFF" filter="url(#soft)"/>
    <text x="98" y="169" font-size="26" font-weight="800" fill="#172033">统一历史记录</text>
    <rect x="98" y="186" width="76" height="28" rx="14" fill="#EEF2FF"/>
    <text x="110" y="205" font-size="12" font-weight="700" fill="#4969E9">危险操作</text>

    <rect x="68" y="258" width="790" height="546" rx="30" fill="#FFFFFF" stroke="#FFFFFF" filter="url(#soft)"/>
    <text x="108" y="310" font-size="12" font-weight="800" fill="#4969E9">历史记录</text>
    <text x="108" y="341" font-size="25" font-weight="750" fill="#172033">星座寰宇 · 小宇的本命星盘</text>
    <text x="108" y="367" font-size="13" font-weight="550" fill="#6D7A92">2026.07.28 · 解读已完成</text>
    <rect x="108" y="390" width="640" height="76" rx="20" fill="#F8FAFD"/>
    <text x="132" y="423" font-size="14" font-weight="750" fill="#172033">本命星盘</text>
    <text x="132" y="447" font-size="12" font-weight="550" fill="#6D7A92">仅显示低敏摘要；出生信息不在列表中展示。</text>
    <rect x="634" y="406" width="90" height="44" rx="22" fill="#FFFFFF" stroke="#DCE3F1"/>
    <text x="679" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#4969E9">继续查看</text>

    <rect x="170" y="510" width="516" height="164" rx="28" fill="#FFFFFF" stroke="#FFE0E6" filter="url(#soft)"/>
    <text x="208" y="552" font-size="19" font-weight="800" fill="#172033">删除这条历史记录？</text>
    <text x="208" y="582" font-size="12" font-weight="550" fill="#6D7A92">将移除出生资料、全部计算修订、解读、问答与分享资产。</text>
    <rect x="438" y="618" width="104" height="44" rx="22" fill="#FFFFFF" stroke="#DCE3F1"/>
    <text x="490" y="646" text-anchor="middle" font-size="14" font-weight="700" fill="#4969E9">取消</text>
    <rect x="554" y="618" width="108" height="44" rx="22" fill="url(#button)"/>
    <text x="608" y="646" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">确认删除</text>

    <rect x="976" y="130" width="370" height="72" rx="25" fill="url(#glass)" stroke="#FFFFFF" filter="url(#soft)"/>
    <text x="1002" y="161" font-size="30" font-weight="500" fill="#6D7A92">‹</text>
    <text x="1033" y="160" font-size="17" font-weight="800" fill="#172033">统一历史记录</text>
    <line x1="1000" y1="183" x2="1322" y2="183" stroke="#E8EDF7"/>
    <text x="1002" y="254" font-size="15" font-weight="800" fill="#172033">星座寰宇 · 小宇的本命星盘</text>
    <text x="1002" y="280" font-size="12" font-weight="550" fill="#6D7A92">2026.07.28 · 仅显示低敏摘要</text>
    <rect x="1002" y="336" width="318" height="236" rx="26" fill="#FFFFFF" stroke="#FFE0E6" filter="url(#soft)"/>
    <text x="1024" y="378" font-size="17" font-weight="800" fill="#172033">删除这条历史记录？</text>
    <text x="1024" y="408" font-size="12" font-weight="550" fill="#6D7A92">将移除出生资料、全部计算修订、</text>
    <text x="1024" y="428" font-size="12" font-weight="550" fill="#6D7A92">解读、问答与分享资产。</text>
    <rect x="1024" y="486" width="122" height="44" rx="22" fill="#FFFFFF" stroke="#DCE3F1"/>
    <text x="1085" y="514" text-anchor="middle" font-size="14" font-weight="700" fill="#4969E9">取消</text>
    <rect x="1160" y="486" width="136" height="44" rx="22" fill="url(#button)"/>
    <text x="1228" y="514" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">确认删除</text>

    <text x="68" y="840" font-size="12" font-weight="600" fill="#6D7A92">桌面与移动内容区均嵌入既有 AI STUDIO 系统导航和命理大师模块侧栏；本视觉稿不重绘任何导航。</text>
  </g>
</svg>
