    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#172033" flood-opacity="0.06"/></filter>
    <filter id="z4" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#4969E9" flood-opacity="0.12"/><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172033" flood-opacity="0.04"/></filter>
  </defs>
