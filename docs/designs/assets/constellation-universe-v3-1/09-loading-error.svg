3" font-weight="750" fill="#172033" text-anchor="start" >已保留：1998 年 10 月 12 日 · 北京</text><text x="218" y="531" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#6D7A92" text-anchor="start" >不会丢失已填写的出生资料。</text><rect x="242" y="560" width="150" height="44" rx="22" fill="url(#btn)" stroke="none" filter="url(#softShadow)"/><text x="317" y="588" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >重新计算</text><rect x="408" y="560" width="150" height="44" rx="22" fill="#FFFFFF" stroke="#DCE3F1" /><text x="483" y="588" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#4969E9" text-anchor="middle" >返回修改</text>
  <rect x="976" y="130" width="370" height="72" rx="25" fill="url(#glass)" stroke="#FFFFFF" filter="url(#z4)"/><text x="1002" y="161" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="500" fill="#6D7A92" text-anchor="start" >‹</text><text x="1033" y="160" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="800" fill="#172033" text-anchor="start" >星盘绘制未完成</text><line x1="1000" y1="183" x2="1322" y2="183" stroke="#E8EDF7" stroke-width="1" /><rect x="1002" y="300" width="318" height="270" rx="28" fill="#FFF7F8" stroke="#FFE0E6" /><rect x="1030" y="332" width="44" height="44" rx="16" fill="#FFFFFF" stroke="none" /><text x="1052" y="361" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="800" fill="#DC5A70" text-anchor="middle" >!</text><text x="1030" y="420" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="800" fill="#172033" text-anchor="start" >暂时无法完成星盘计算</text><text x="1030" y="450" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="500" fill="#6D7A92" text-anchor="start" >出生资料已保留，可以重试或返回修改。</text><rect x="1030" y="496" width="124" height="44" rx="22" fill="url(#btn)" stroke="none" filter="url(#softShadow)"/><text x="1092" y="524" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >重新计算</text><rect x="1166" y="496" width="124" height="44" rx="22" fill="#FFFFFF" stroke="#DCE3F1" /><text x="1228" y="524" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#4969E9" text-anchor="middle" >返回修改</text>
