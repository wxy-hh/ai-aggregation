  <circle cx="1340" cy="772" r="230" fill="#E6E0FF" opacity="0.6"/>
  <rect x="68" y="46" width="193" height="28" rx="14" fill="#EEF2FF" stroke="none" /><text x="80" y="65" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#4969E9" text-anchor="start" >P0 · 右侧内容区视觉稿</text>
  <text x="68" y="101" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start" >星座寰宇 · 加载失败恢复</text>
  <text x="68" y="124" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="550" fill="#6D7A92" text-anchor="start" >保留资料，可重试或返回修改</text>
  <text x="68" y="840" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#6D7A92" text-anchor="start" >桌面与移动内容区均嵌入既有 AI STUDIO 系统导航和命理大师模块侧栏；本视觉稿不重绘任何导航。</text>
  <text x="976" y="101" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="800" fill="#4969E9" text-anchor="start" >移动端内容区</text>
