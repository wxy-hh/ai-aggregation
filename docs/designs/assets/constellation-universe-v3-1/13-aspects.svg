  <text x="68" y="101" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="start" >星座寰宇 · 关键相位</text>
  <text x="68" y="124" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="550" fill="#6D7A92" text-anchor="start" >三至五条可解释的相位</text>
  <text x="68" y="840" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#6D7A92" text-anchor="start" >桌面与移动内容区均嵌入既有 AI STUDIO 系统导航和命理大师模块侧栏；本视觉稿不重绘任何导航。</text>
