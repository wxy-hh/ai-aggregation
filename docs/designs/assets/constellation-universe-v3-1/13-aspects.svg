soft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#6D7A92" text-anchor="start" >拱相 · 容许度 2°18′</text><rect x="108" y="488" width="642" height="76" rx="20" fill="#FFFFFF" stroke="#E7ECF5" filter="url(#cardShadow)"/><rect x="128" y="512" width="115" height="28" rx="14" fill="#FFF0F3" stroke="none" /><text x="140" y="531" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#DC5A70" text-anchor="start" >太阳 □ 火星</text><text x="128" y="547" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="650" fill="#172033" text-anchor="start" >主动感强，也要练习放慢反应。</text><text x="590" y="547" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#6D7A92" text-anchor="start" >刑相 · 容许度 3°42′</text><rect x="108" y="584" width="642" height="76" rx="20" fill="#FFFFFF" stroke="#E7ECF5" filter="url(#cardShadow)"/><rect x="128" y="608" width="115" height="28" rx="14" fill="#EEF2FF" stroke="none" /><text x="140" y="627" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#4969E9" text-anchor="start" >水星 ☌ 木星</text><text x="128" y="643" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="650" fill="#172033" text-anchor="start" >善于把想法组织成可被理解的表达。</text><text x="590" y="643" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#6D7A92" text-anchor="start" >合相 · 容许度 1°06′</text>
