t-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#4969E9" text-anchor="start" >水星 ☌ 木星</text><text x="1020" y="570" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" fill="#172033" text-anchor="start" >把想法组织成清晰表达。</text>
