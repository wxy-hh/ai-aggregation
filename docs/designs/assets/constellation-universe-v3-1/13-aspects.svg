  <title id="title">星座寰宇 · 关键相位</title>
  <desc id="desc">三至五条可解释的相位。展示可嵌入既有 AI STUDIO 与命理大师壳层的桌面和移动右侧内容区。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9FBFF"/><stop offset="1" stop-color="#EDF2FF"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.86"/><stop offset="1" stop-color="#F8FAFF" stop-opacity="0.68"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4969E9"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="share" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4969E9"/><stop offset="0.55" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4969E9" flood-opacity="0.18"/></filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#172033" flood-opacity="0.06"/></filter>
